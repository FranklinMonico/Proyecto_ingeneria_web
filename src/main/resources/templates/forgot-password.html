<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1F4E79, #2E75B6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { color: #1F4E79; font-size: 24px; }
        .logo p { color: #666; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 14px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; outline: none;
        }
        input:focus { border-color: #1F4E79; }
        button {
            width: 100%; padding: 13px;
            background: #1F4E79; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        button:hover { background: #2E75B6; }
        .error { background: #fee2e2; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .success { background: #d1fae5; color: #065f46; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .back-link { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
        .back-link a { color: #1F4E79; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🔐 Recuperar contraseña</h1>
        <p>Te enviaremos un enlace a tu correo</p>
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@email.com"/>
    </div>

    <button onclick="forgotPassword()">Enviar enlace</button>

    <div class="back-link">
        <a href="/view/login">← Volver al login</a>
    </div>
</div>

<script>
    async function forgotPassword() {
        const email = document.getElementById('email').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (!email) {
            errorMsg.textContent = 'Ingresa tu email';
            errorMsg.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/auth/forgot-password?email=' + encodeURIComponent(email), {
                method: 'POST'
            });

            const data = await res.json();
            successMsg.textContent = data.message;
            successMsg.style.display = 'block';

        } catch(e) {
            errorMsg.textContent = 'Error de conexión';
            errorMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
