<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login — Student Services</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1F4E79, #2E75B6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 { color: #1F4E79; font-size: 26px; }
        .logo p { color: #666; font-size: 14px; margin-top: 4px; }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #1F4E79; }
        button {
            width: 100%;
            padding: 13px;
            background: #1F4E79;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #2E75B6; }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        .register-link a { color: #1F4E79; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🎓 Student Services</h1>
        <p>Plataforma de Cursos en Línea</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@email.com"/>
    </div>
    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••"/>
    </div>

    <button onclick="login()">Iniciar sesión</button>

    <div class="register-link">
        ¿No tienes cuenta? <a href="/view/register">Regístrate aquí</a>
    </div>
    <div class="register-link" style="margin-top:12px;">
        <a href="/view/forgot-password" style="color:#666;font-size:13px;">¿Olvidaste tu contraseña?</a>
    </div>
</div>

<script>
    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!email || !password) {
            errorMsg.textContent = 'Completa todos los campos';
            errorMsg.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.success) {
             localStorage.setItem('token', data.data.accessToken);
             localStorage.setItem('refreshToken', data.data.refreshToken);
             localStorage.setItem('email', email);
            window.location.href = '/view/dashboard';
            } else {
                errorMsg.textContent = data.message || 'Credenciales incorrectas';
                errorMsg.style.display = 'block';
            }
        } catch(e) {
            errorMsg.textContent = 'Error de conexión';
            errorMsg.style.display = 'block';
        }
    }

    // Enter para login
    document.addEventListener('keypress', e => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
