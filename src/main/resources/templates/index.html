<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Autogestión de Cursos</title>
</head>
<body style="margin:0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #007bff, #00c6ff);">

<div style="display:flex; justify-content:center; align-items:center; height:100vh;">

    <div style="background:white; padding:40px; border-radius:15px; text-align:center; width:400px; box-shadow:0px 10px 30px rgba(0,0,0,0.2);">

        <h1 style="color:#333; margin-bottom:10px;">
            Bienvenido 👋
        </h1>

        <p style="color:#666; margin-bottom:30px;">
            Sistema de <strong>Autogestión de Cursos</strong>
        </p>

        <!-- BOTÓN REGISTER -->
        <a href="/view/register"
           style="display:block; text-decoration:none; margin-bottom:15px;">
            <button style="width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;">
                Registrarse
            </button>
        </a>

        <!-- BOTÓN LOGIN -->
        <a href="/view/login"
           style="display:block; text-decoration:none;">
            <button style="width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;">
                Iniciar Sesión
            </button>
        </a>

    </div>

</div>

</body>
</html>
