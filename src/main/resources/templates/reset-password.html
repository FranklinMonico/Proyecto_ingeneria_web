<!DOCTYPE html>
<html>
<body style="font-family: Arial; text-align:center; background:#f4f4f4; padding:20px;">

<div style="max-width:600px; margin:auto; background:white; padding:30px; border-radius:10px;">

    <h2>Restablecer Contraseña</h2>

    <p>Hola, <strong th:text="${name}"></strong></p>

    <p>Haz clic en el botón para cambiar tu contraseña:</p>

    <a th:href="${link}"
       style="display:inline-block; padding:15px 25px; margin-top:20px;
                  background:#dc3545; color:white; text-decoration:none; border-radius:5px;">
        Cambiar Contraseña
    </a>

    <p style="margin-top:30px; font-size:12px; color:#999;">
        Este enlace expirará en 30 minutos.
    </p>

</div>

</body>
</html>
