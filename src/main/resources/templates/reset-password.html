<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1F4E79, #2E75B6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { color: #1F4E79; font-size: 24px; }
        .logo p { color: #666; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 14px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; outline: none;
        }
        input:focus { border-color: #1F4E79; }
        button {
            width: 100%; padding: 13px;
            background: #1F4E79; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        button:hover { background: #2E75B6; }
        .error { background: #fee2e2; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .success { background: #d1fae5; color: #065f46; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🔑 Nueva contraseña</h1>
        <p>Ingresa tu nueva contraseña</p>
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <div class="form-group">
        <label>Nueva contraseña</label>
        <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres"/>
    </div>
    <div class="form-group">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmPassword" placeholder="Repite la contraseña"/>
    </div>

    <button onclick="resetPassword()">Cambiar contraseña</button>
</div>

<script>
    // Obtener token de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
        document.getElementById('errorMsg').textContent = 'Token inválido o expirado';
        document.getElementById('errorMsg').style.display = 'block';
    }

    async function resetPassword() {
        const newPassword = document.getElementById('newPassword').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (!newPassword || !confirmPassword) {
            errorMsg.textContent = 'Completa todos los campos';
            errorMsg.style.display = 'block';
            return;
        }

        if (newPassword !== confirmPassword) {
            errorMsg.textContent = 'Las contraseñas no coinciden';
            errorMsg.style.display = 'block';
            return;
        }

        if (newPassword.length < 6) {
            errorMsg.textContent = 'La contraseña debe tener mínimo 6 caracteres';
            errorMsg.style.display = 'block';
            return;
        }

        try {
            const res = await fetch(
                `/api/auth/reset-password?token=${token}&newPassword=${encodeURIComponent(newPassword)}`,
                { method: 'POST' }
            );

            const data = await res.json();

            if (data.success) {
                successMsg.textContent = '✅ Contraseña actualizada. Redirigiendo...';
                successMsg.style.display = 'block';
                setTimeout(() => window.location.href = '/view/login', 2000);
            } else {
                errorMsg.textContent = data.message || 'Error al actualizar';
                errorMsg.style.display = 'block';
            }
        } catch(e) {
            errorMsg.textContent = 'Error de conexión';
            errorMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
