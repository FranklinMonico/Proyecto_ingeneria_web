version: '3.8'

services:

  mysql-student:
    image: mysql:8.0
    container_name: mysql-student
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: student_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-student-data:/var/lib/mysql
    networks:
      - student-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  student-services:
    build: .
    container_name: student-services
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-student:3306/student_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_RABBITMQ_HOST: 84.46.241.34
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: cambia_esta_password
      SPRING_MAIL_HOST: sandbox.smtp.mailtrap.io
      SPRING_MAIL_PORT: 2525
      SPRING_MAIL_USERNAME: bab84ba3d66ad5
      SPRING_MAIL_PASSWORD: 12aa6c462a66b2
      ESPOCRM_URL: http://host.docker.internal:8082
      ESPOCRM_API_KEY: 1bd355c4ec1cf60dd20374d9b5a53bc2
      LEARNING_ENGINE_URL: https://lexicological-semestrial-johnathan.ngrok-free.dev
      UPLOAD_PATH: /app/uploads/
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql-student:
        condition: service_healthy
    networks:
      - student-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    ports:
      - "3000:80"
    depends_on:
      - student-services
    networks:
      - student-network

volumes:
  mysql-student-data:

networks:
  student-network:
    driver: bridge